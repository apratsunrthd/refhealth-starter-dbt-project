version: 2

models:
  - name: stg_members
    description: "Staging model standardizing member eligibility rosters, demographics, and coverage dates."
    columns:
      - name: member_id
        description: "Primary identifier for member eligibility."
        tests:
          - unique
          - not_null
      - name: coverage_effective_date
        description: "Inception date of health coverage."
        tests:
          - not_null
    tests:
      - refhealth_dbt_healthcare_checks.bitemporal_enrollment_consistency:
          effective_date: coverage_effective_date
          end_date: coverage_term_date
          enrollment_date: enrollment_date
          updated_date: updated_date

  - name: stg_providers
    description: "Staging model standardizing provider directory records."
    columns:
      - name: npi
        description: "10-digit National Provider Identifier (NPI)."
        tests:
          - unique
          - not_null
          - refhealth_dbt_healthcare_checks.cms_npi_format

  - name: stg_claims
    description: "Staging model standardizing professional and facility claims line items."
    columns:
      - name: claim_line_surrogate_id
        description: "Surrogate key generated at the (claim_id, claim_line_number) grain."
        tests:
          - unique
          - not_null
      - name: claim_id
        description: "Claim identifier from upstream EDI 837/clearinghouse feed."
        tests:
          - not_null
      - name: claim_line_number
        description: "Sub-line index within the parent claim."
        tests:
          - not_null
      - name: member_id
        description: "Foreign key to the patient/member."
        tests:
          - not_null
      - name: date_of_service
        description: "Encounter date of service."
        tests:
          - not_null
      - name: billing_npi
        description: "NPI of billing provider/organization."
        tests:
          - not_null
          - refhealth_dbt_healthcare_checks.cms_npi_format
      - name: rendering_npi
        description: "NPI of rendering clinician."
        tests:
          - not_null
          - refhealth_dbt_healthcare_checks.cms_npi_format
      - name: primary_diagnosis_code
        description: "ICD-10-CM primary diagnosis code."
        tests:
          - not_null
          - refhealth_dbt_healthcare_checks.icd10_code_validity
      - name: procedure_code
        description: "HCPCS/CPT procedure code."
        tests:
          - not_null
          - refhealth_dbt_healthcare_checks.hcpcs_cpt_code_validity
      - name: created_at
        description: "Pipeline creation timestamp."
        tests:
          - not_null
          - refhealth_dbt_healthcare_checks.midnight_default_timestamp:
              max_midnight_ratio: 0.20
    tests:
      - refhealth_dbt_healthcare_checks.surrogate_key_grain:
          grain_columns:
            - claim_id
            - claim_line_number

  - name: stg_plan_premiums
    description: "Staging model standardizing monthly plan premium revenue and enrolled member month counts."
    columns:
      - name: plan_month_surrogate_id
        description: "Surrogate key generated at the (plan_id, service_month) grain."
        tests:
          - unique
          - not_null
      - name: plan_id
        description: "Healthcare plan identifier."
        tests:
          - not_null
      - name: service_month
        description: "First day of the accounting/service month."
        tests:
          - not_null
      - name: earned_premium_amount
        description: "Total earned premium dollar amount for the plan and month."
        tests:
          - not_null
      - name: enrolled_member_months
        description: "Total enrolled member months for the plan in this period."
        tests:
          - not_null
    tests:
      - refhealth_dbt_healthcare_checks.surrogate_key_grain:
          grain_columns:
            - plan_id
            - service_month

  - name: stg_fhir_encounters
    description: "Staging model standardizing FHIR Encounter resources from clinical EHR data feeds."
    columns:
      - name: encounter_surrogate_id
        description: "Surrogate key generated at the encounter_id grain."
        tests:
          - unique
          - not_null
      - name: encounter_id
        description: "Primary FHIR encounter resource identifier."
        tests:
          - unique
          - not_null
      - name: status
        description: "Normalized FHIR encounter status code."
        tests:
          - not_null
          - accepted_values:
              values: ['finished', 'in-progress', 'planned', 'triaged']
      - name: class_code
        description: "ActEncounterCode classification (AMB, IMP, EMER, VR)."
        tests:
          - not_null
          - accepted_values:
              values: ['AMB', 'IMP', 'EMER', 'VR', 'HH']
      - name: type_code
        description: "Service or procedure code associated with the encounter."
        tests:
          - not_null
          - refhealth_dbt_healthcare_checks.hcpcs_cpt_code_validity
      - name: encounter_date
        description: "Calendar date derived from period_start."
        tests:
          - not_null
      - name: service_provider_npi
        description: "10-digit NPI of the servicing organization or provider."
        tests:
          - not_null
          - refhealth_dbt_healthcare_checks.cms_npi_format
      - name: subject_member_id
        description: "Foreign key reference to patient/member."
        tests:
          - not_null
    tests:
      - refhealth_dbt_healthcare_checks.surrogate_key_grain:
          grain_columns:
            - encounter_id


