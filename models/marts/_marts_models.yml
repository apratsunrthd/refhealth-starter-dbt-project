version: 2

models:
  - name: dim_members
    description: "Dimensional model of members including coverage active flags and sanitized demographics."
    columns:
      - name: member_id
        description: "Primary key for member dimension."
        tests:
          - unique
          - not_null
      - name: coverage_effective_date
        description: "Coverage start date."
        tests:
          - not_null
      - name: is_currently_enrolled
        description: "Boolean indicating active coverage status based on current date."
        tests:
          - not_null

  - name: dim_providers
    description: "Dimensional model of healthcare providers and rendering facilities."
    columns:
      - name: npi
        description: "Primary key 10-digit National Provider Identifier (NPI)."
        tests:
          - unique
          - not_null
          - refhealth_dbt_healthcare_checks.cms_npi_format

  - name: fct_claims
    description: "Fact model of adjudicated claims line items enriched with member coverage and billing provider dimensions."
    columns:
      - name: claim_line_surrogate_id
        description: "Surrogate key uniquely identifying each claim line."
        tests:
          - unique
          - not_null
      - name: claim_id
        description: "Parent claim transaction ID."
        tests:
          - not_null
      - name: member_id
        description: "Member foreign key."
        tests:
          - not_null
          - relationships:
              to: ref('dim_members')
              field: member_id
      - name: billing_npi
        description: "Billing provider NPI."
        tests:
          - not_null
          - relationships:
              to: ref('dim_providers')
              field: npi
      - name: paid_amount
        description: "Adjudicated dollar amount paid by the plan."
        tests:
          - not_null
      - name: adjudication_lag_days
        description: "Days between encounter date of service and final claim payment date."
        tests:
          - not_null
    tests:
      - refhealth_dbt_healthcare_checks.claim_member_referential_integrity:
          member_model: ref('dim_members')
          claim_member_id: member_id
          service_date: date_of_service
          effective_date: coverage_effective_date
          end_date: coverage_term_date
      - refhealth_dbt_healthcare_checks.surrogate_key_grain:
          grain_columns:
            - claim_id
            - claim_line_number

  - name: fct_plan_monthly_metrics
    description: "Monthly plan-level actuarial and financial metrics mart including Medical Loss Ratio (MLR), Allowed PMPM, Net Paid PMPM, Member Cost-Share Ratio, and Adjudication Lag."
    columns:
      - name: plan_month_surrogate_id
        description: "Surrogate key generated at the (plan_id, service_month) grain."
        tests:
          - unique
          - not_null
      - name: plan_id
        description: "Healthcare plan identifier."
        tests:
          - not_null
      - name: service_month
        description: "First day of the accounting/service month."
        tests:
          - not_null
      - name: earned_premium_amount
        description: "Total earned premium dollar amount for the plan and month."
        tests:
          - not_null
      - name: enrolled_member_months
        description: "Total enrolled member months for the plan in this period."
        tests:
          - not_null
      - name: medical_loss_ratio
        description: "Medical Loss Ratio (total paid claims / earned premium revenue)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.50
              max_value: 1.50
      - name: allowed_pmpm
        description: "Allowed cost Per Member Per Month (total allowed claims / enrolled member months)."
        tests:
          - not_null
      - name: net_paid_pmpm
        description: "Net plan paid cost Per Member Per Month (total paid claims / enrolled member months)."
        tests:
          - not_null
      - name: member_cost_share_ratio
        description: "Member cost-sharing percentage (patient due / total allowed)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.0
              max_value: 1.0
      - name: median_adjudication_lag_days
        description: "Median days elapsed from date of service to claim payment date."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: p90_adjudication_lag_days
        description: "90th percentile days elapsed from date of service to claim payment date."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
    tests:
      - refhealth_dbt_healthcare_checks.surrogate_key_grain:
          grain_columns:
            - plan_id
            - service_month

